name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish signed Android release
    needs: quality
    runs-on: ubuntu-latest
    env:
      AIUSAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AIUSAGE_ANDROID_KEYSTORE_PASSWORD }}
      AIUSAGE_ANDROID_KEY_ALIAS: ${{ secrets.AIUSAGE_ANDROID_KEY_ALIAS }}
      AIUSAGE_ANDROID_KEY_PASSWORD: ${{ secrets.AIUSAGE_ANDROID_KEY_PASSWORD }}
      AIUSAGE_ANDROID_CERT_SHA256: ${{ vars.AIUSAGE_ANDROID_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          version="${tag#v}"
          app_version="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          rust_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          [[ "$app_version" == "$version" ]] || { echo "Flutter version $app_version does not match $tag"; exit 1; }
          [[ "$rust_version" == "$version" ]] || { echo "Rust version $rust_version does not match $tag"; exit 1; }
          test -f "docs/releases/$tag.md" || { echo "Missing release notes for $tag"; exit 1; }
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Restore dependencies
        working-directory: app
        run: flutter pub get
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AIUSAGE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aiusage-release.jks"
          chmod 600 "$RUNNER_TEMP/aiusage-release.jks"
          echo "AIUSAGE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aiusage-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        shell: pwsh
        run: ./scripts/build_android_release.ps1 -Format apk -FlutterRoot $env:FLUTTER_ROOT -RequireSignature
      - name: Build signed AAB
        shell: pwsh
        run: ./scripts/build_android_release.ps1 -Format appbundle -FlutterRoot $env:FLUTTER_ROOT -RequireSignature
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/AiUsage-v${version}-android-arm64.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/AiUsage-v${version}-android-arm64.aab"
          (cd dist && sha256sum AiUsage-* > "AiUsage-v${version}-SHA256SUMS.txt")
      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AiUsage $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag \
            --latest
