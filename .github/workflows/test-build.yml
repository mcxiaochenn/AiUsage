name: Main Test Builds

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Signed Android ${{ matrix.target }} test candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - universal
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    env:
      AIUSAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AIUSAGE_ANDROID_KEYSTORE_PASSWORD }}
      AIUSAGE_ANDROID_KEY_ALIAS: ${{ secrets.AIUSAGE_ANDROID_KEY_ALIAS }}
      AIUSAGE_ANDROID_KEY_PASSWORD: ${{ secrets.AIUSAGE_ANDROID_KEY_PASSWORD }}
      AIUSAGE_ANDROID_CERT_SHA256: ${{ vars.AIUSAGE_ANDROID_CERT_SHA256 }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Restore dependencies
        working-directory: app
        run: flutter pub get
      - name: Restore test signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AIUSAGE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aiusage-main-test.jks"
          chmod 600 "$RUNNER_TEMP/aiusage-main-test.jks"
          echo "AIUSAGE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aiusage-main-test.jks" >> "$GITHUB_ENV"
      - name: Build and inspect signed Android candidate
        shell: pwsh
        run: ./scripts/build_android_release.ps1 -Target ${{ matrix.target }} -FlutterRoot $env:FLUTTER_ROOT -RequireSignature
      - name: Name Android candidate for this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "app/build/release/AiUsage-android-release-${{ matrix.target }}.apk" \
            "dist/AiUsage-main-${GITHUB_SHA}-android-release-${{ matrix.target }}.apk"
      - name: Upload Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}-main-${{ github.sha }}
          path: dist/AiUsage-main-${{ github.sha }}-android-release-${{ matrix.target }}.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Unsigned iOS test candidate
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install iOS Rust target
        run: rustup target add aarch64-apple-ios
      - name: Restore dependencies
        working-directory: app
        run: flutter pub get
      - name: Build and inspect unsigned IPA
        run: ./scripts/build_ios_release.sh
      - name: Name iOS candidate for this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/release/AiUsage-ios-release-unsigned.ipa \
            "dist/AiUsage-main-${GITHUB_SHA}-ios-release-unsigned.ipa"
      - name: Upload iOS candidate
        uses: actions/upload-artifact@v4
        with:
          name: ios-main-${{ github.sha }}
          path: dist/AiUsage-main-${{ github.sha }}-ios-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package test candidate matrix
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-main-${{ github.sha }}'
          path: dist
          merge-multiple: true
      - name: Verify matrix and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "AiUsage-main-${GITHUB_SHA}-android-release-universal.apk"
            "AiUsage-main-${GITHUB_SHA}-android-release-arm64-v8a.apk"
            "AiUsage-main-${GITHUB_SHA}-android-release-armeabi-v7a.apk"
            "AiUsage-main-${GITHUB_SHA}-android-release-x86_64.apk"
            "AiUsage-main-${GITHUB_SHA}-ios-release-unsigned.ipa"
          )
          for asset in "${expected[@]}"; do
            test -f "dist/$asset" || { echo "Missing test candidate: $asset"; exit 1; }
          done
          [[ "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" == "${#expected[@]}" ]] || {
            echo 'Unexpected files in test candidate directory'
            find dist -maxdepth 1 -type f
            exit 1
          }
          (cd dist && sha256sum "${expected[@]}" > "AiUsage-main-${GITHUB_SHA}-SHA256SUMS.txt")
      - name: Upload complete test candidate
        uses: actions/upload-artifact@v4
        with:
          name: AiUsage-main-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
